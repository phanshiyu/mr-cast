[workspace]
resolver = "3"
members = ["core", "cli"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"

# Pixel loops are slow unoptimised; tests and debug runs still finish quickly with this.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
