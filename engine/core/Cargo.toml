[package]
name = "mrc_core"
description = "mr-cast's frame renderer: the props model, timing, text fitting, scenes and a CPU rasterizer. No threads, files or processes, so it builds for wasm32-unknown-unknown."
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Mermaid diagrams drawn natively with merman; without it a mermaid scene draws a message in the frame.
mermaid = ["dep:merman"]

[dependencies]
merman = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
swash = "0.2"
kurbo = "0.13"
fancy-regex = "0.20"
unicode-normalization = "0.1"
resvg = { version = "0.50", default-features = false, features = ["text"] }
