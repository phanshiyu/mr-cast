[package]
name = "mr-cast-engine"
description = "Renders mr-cast props to a video or a still with mrc_core."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "mr-cast-engine"
path = "src/main.rs"

[dependencies]
hound = "3"
mrc_core = { path = "../core" }
rayon = "1"
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
