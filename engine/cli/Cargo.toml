[package]
name = "mr-cast-engine"
description = "Renders mr-cast props to a video or a still with mrc_core."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "mr-cast-engine"
path = "src/main.rs"

[dependencies]
mrc_core = { path = "../core" }
rayon = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
