[package]
name = "mr-cast-engine"
description = "Renders mr-cast props to a video or a still with mrc_core."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "mr-cast-engine"
path = "src/main.rs"

[dependencies]
dizione = { path = "../dizione" }
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
tract-core = "0.23.10"
tract-hir = "0.23.10"
tract-onnx = { version = "0.23.10", default-features = false }
fdk-aac-sys = "0.5.0"
hound = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
mrc_core = { path = "../core", features = ["mermaid"] }
openh264-sys2 = "0.9.10"
rayon = "1"
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
