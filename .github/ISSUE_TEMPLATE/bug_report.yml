name: Bug report
description: Something in mr-cast or its skill does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked Claude for or ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The command that failed and its full output, or the validate errors.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mr-cast --version`.
      placeholder: mr-cast 0.24.0 (node v24.11.0)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Storyboard or stills
      description: For a bug in a video, attach the run's storyboard.json and a still from `mr-cast still`. Remove anything private first.
