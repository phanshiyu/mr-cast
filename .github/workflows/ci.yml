name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MR_CAST_NO_UPDATE_CHECK: '1'
  # What the audits compare with: a pull request's base, the commit a push replaced, or itself when started by hand.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

jobs:
  typecheck:
    name: Typecheck, lint, format and unused code
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check
      - name: Report duplication and complexity
        continue-on-error: true
        run: |
          pnpm exec fallow dupes --format github-summary >> "$GITHUB_STEP_SUMMARY"
          pnpm exec fallow health --report-only --format github-summary >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the player
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          wasm-bindgen: 'true'
      - run: pnpm build
      - run: test -f dist/index.html && ls dist/assets/*.wasm

  rust:
    name: Engine (fmt, clippy, tests, wasm)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          wasm-bindgen: 'true'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node ../scripts/build-wasm.mjs

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test

  validate:
    name: Validate the examples
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm validate:examples

  # Fails only on an advisory that the base does not already have, so an advisory on main never blocks the pull request
  # that fixes it. The full audit of main is .github/workflows/audit.yml (docs/adr/0040-advisories-do-not-block-their-fix.md).
  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm audit exits 1 when it finds advisories; scripts/audit-new.mjs judges the files and fails when one did not run.
      - name: Audit the base and this change
        run: |
          (cd base && pnpm audit --json > "$RUNNER_TEMP/audit-base.json" || true)
          pnpm audit --json > "$RUNNER_TEMP/audit-head.json" || true
          node scripts/audit-new.mjs "$RUNNER_TEMP/audit-head.json" "$RUNNER_TEMP/audit-base.json"

  render:
    name: Render, voice and player smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          wasm-bindgen: 'true'
      - run: cargo build --release --locked --manifest-path engine/Cargo.toml
      # The smoke's text scan drives the Chrome that Remotion downloads (scripts/smoke.sh).
      - id: versions
        run: echo "remotion=$(node -p "require('./node_modules/@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/remotion
          key: chrome-${{ runner.os }}-remotion-${{ steps.versions.outputs.remotion }}
      - name: Cache the Kitten voice model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/kitten
          key: kitten-tts-mini-0.8-c0272566
      - run: pnpm build
      - run: scripts/smoke.sh "$RUNNER_TEMP/smoke"
      - name: Show the smoke logs as annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/smoke/*.txt "$RUNNER_TEMP"/smoke/textscan/console.txt; do
            [ -s "$f" ] || continue
            echo "::error title=$(basename "$f")::$(tail -n 30 "$f" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
      - name: Upload stills and the text scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/smoke/stills
            ${{ runner.temp }}/smoke/textscan
            ${{ runner.temp }}/smoke/*.txt
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Pack and install with npm
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
          wasm-bindgen: 'true'
      # As publish.yml does for every platform: the engine goes into the package under engine/bin/<platform>-<arch>.
      - name: Build the engine into engine/bin
        run: |
          cargo build --release --locked -p mr-cast-engine --manifest-path engine/Cargo.toml
          mkdir -p engine/bin/linux-x64
          cp engine/target/release/mr-cast-engine engine/bin/linux-x64/
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: The package holds the engine and the player's wasm, and no Rust sources or build output
        run: |
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz > "$RUNNER_TEMP/files.txt"
          grep -qx 'package/engine/bin/linux-x64/mr-cast-engine' "$RUNNER_TEMP/files.txt"
          grep -q '^package/dist/assets/.*\.wasm$' "$RUNNER_TEMP/files.txt"
          ! grep -E '^package/engine/(target|core|cli|wasm)/' "$RUNNER_TEMP/files.txt"
      - name: Install the tarball with npm
        run: npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/pack/*.tgz
      - name: Run the installed CLI
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          MRC="$RUNNER_TEMP/prefix/bin/mr-cast"
          "$MRC" --version
          mkdir -p "$RUNNER_TEMP/gallery" && cp examples/gallery/*.json "$RUNNER_TEMP/gallery/"
          "$MRC" validate --dir "$RUNNER_TEMP/gallery"
          "$MRC" still 0 7 --dir "$RUNNER_TEMP/gallery" --out "$RUNNER_TEMP/stills"
          test "$(find "$RUNNER_TEMP/stills" -name '*.png' -size +10k | wc -l)" -eq 2
          "$MRC" render --no-voice --dir "$RUNNER_TEMP/gallery" --out "$RUNNER_TEMP/gallery.mp4"
          test -s "$RUNNER_TEMP/gallery.mp4"
      # The installed tree is what npm resolves from the dependencies in package.json, so the base's tree is the same
      # install made from the base's package.json. Only advisories the base does not have fail (ADR 40).
      - name: Audit the installed dependency tree against the base
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/consumer-base"
          (cd "$RUNNER_TEMP/consumer" && npm init -y > /dev/null && npm install "$RUNNER_TEMP"/pack/*.tgz && { npm audit --json > "$RUNNER_TEMP/npm-audit-head.json" || true; })
          git fetch --depth=1 origin "$BASE_SHA"
          git show FETCH_HEAD:package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(JSON.stringify({ name: "consumer", version: "1.0.0", private: true, dependencies: p.dependencies }))' > "$RUNNER_TEMP/consumer-base/package.json"
          (cd "$RUNNER_TEMP/consumer-base" && npm install --package-lock-only --ignore-scripts && { npm audit --json > "$RUNNER_TEMP/npm-audit-base.json" || true; })
          node scripts/audit-new.mjs "$RUNNER_TEMP/npm-audit-head.json" "$RUNNER_TEMP/npm-audit-base.json"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [typecheck, build, rust, test, validate, audit, render, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          node -e 'const r = JSON.parse(process.env.RESULTS); process.exit(r.every((x) => x === "success") ? 0 : 1)'
