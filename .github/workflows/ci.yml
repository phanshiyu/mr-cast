name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MR_CAST_NO_UPDATE_CHECK: '1'

jobs:
  typecheck:
    name: Typecheck, lint, format and unused code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check
      - name: Report duplication and complexity
        continue-on-error: true
        run: |
          pnpm exec fallow dupes --format github-summary >> "$GITHUB_STEP_SUMMARY"
          pnpm exec fallow health --report-only --format github-summary >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the player
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: test -f dist/index.html

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test

  validate:
    name: Validate the examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm validate:examples

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level moderate

  render:
    name: Render, voice and player smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - id: versions
        run: echo "remotion=$(node -p "require('./node_modules/@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/remotion
          key: chrome-${{ runner.os }}-remotion-${{ steps.versions.outputs.remotion }}
      - name: Cache the Kitten voice model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/kitten
          key: kitten-tts-mini-0.8-c0272566
      - run: pnpm build
      - run: scripts/smoke.sh "$RUNNER_TEMP/smoke"
      - name: Show the smoke logs as annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/smoke/*.txt "$RUNNER_TEMP"/smoke/textscan/console.txt; do
            [ -s "$f" ] || continue
            echo "::error title=$(basename "$f")::$(tail -n 30 "$f" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
      - name: Upload stills and the text scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/smoke/stills
            ${{ runner.temp }}/smoke/textscan
            ${{ runner.temp }}/smoke/*.txt
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Pack and install with npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: versions
        run: echo "remotion=$(node -p "require('./node_modules/@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/remotion
          key: chrome-${{ runner.os }}-remotion-${{ steps.versions.outputs.remotion }}
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the tarball with npm
        run: npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/pack/*.tgz
      - name: Run the installed CLI
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          MRC="$RUNNER_TEMP/prefix/bin/mr-cast"
          "$MRC" --version
          mkdir -p "$RUNNER_TEMP/gallery" && cp examples/gallery/*.json "$RUNNER_TEMP/gallery/"
          "$MRC" validate --dir "$RUNNER_TEMP/gallery"
          "$MRC" still 0 7 --dir "$RUNNER_TEMP/gallery" --out "$RUNNER_TEMP/stills"
          test "$(find "$RUNNER_TEMP/stills" -name '*.png' -size +10k | wc -l)" -eq 2
      - name: Audit the installed dependency tree
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/*.tgz
          npm audit --audit-level moderate

  ci-ok:
    name: ci-ok
    if: always()
    needs: [typecheck, build, test, validate, audit, render, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          node -e 'const r = JSON.parse(process.env.RESULTS); process.exit(r.every((x) => x === "success") ? 0 : 1)'
