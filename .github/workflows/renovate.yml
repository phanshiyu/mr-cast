name: Renovate

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Pick the token
        id: auth
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          PAT: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$PAT" ]; then
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "::notice title=Renovate skipped::Add the RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY secrets (a GitHub App), or RENOVATE_TOKEN (a fine-grained token). See SECURITY.md."
          fi
      - name: Mint a GitHub App token
        id: app
        if: steps.auth.outputs.source == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.source != 'none'
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        if: steps.auth.outputs.source != 'none'
        with:
          token: ${{ steps.app.outputs.token || secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.json
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
