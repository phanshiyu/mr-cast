name: Publish

# Publishes to npm after CI passes on main, when package.json holds a version npm does not have yet, then renders
# every example across six runners and attaches the MP4s to the GitHub release for that version
# (docs/adr/0021-example-videos-as-release-assets.md, docs/adr/0022-shard-the-example-renders.md).
# Started by hand, it also re-renders the examples for the version in package.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  MR_CAST_NO_UPDATE_CHECK: '1'

jobs:
  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Must match the environment in the package's trusted publisher on npmjs.com.
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      # Trusted publishing: npm checks this run's GitHub OIDC identity against the package's trusted
      # publisher (phanshiyu/mr-cast, publish.yml), so no token is stored. Needs npm 11.5.1 or later.
      - name: Check the version
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack
        if: steps.check.outputs.publish == 'true'
        run: pnpm pack --out mr-cast.tgz
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: |
          npm --version
          if ! npm publish mr-cast.tgz --access public > "$RUNNER_TEMP/publish.log" 2>&1; then
            cat "$RUNNER_TEMP/publish.log"
            # Job logs need auth to read; annotations are public.
            grep -E 'npm (error|ERR!)' "$RUNNER_TEMP/publish.log" | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/publish.log"
          echo "::notice::Published ${{ steps.check.outputs.version }}"

  release:
    name: Open the release as a draft
    needs: publish
    if: needs.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.publish.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    # A new release stays a draft until every shard has attached its videos, so the latest/download links never
    # point at a release without them.
    steps:
      - run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --notes "See [CHANGELOG.md](https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md)."
          fi

  media:
    name: Render examples, shard ${{ matrix.shard }} of 6
    needs: [publish, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TAG: v${{ needs.publish.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: versions
        run: echo "remotion=$(node -p "require('./node_modules/@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/remotion
          key: chrome-${{ runner.os }}-remotion-${{ steps.versions.outputs.remotion }}
      - name: Cache the Kokoro voice model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mr-cast/models
          key: kokoro-82m-v1.0-q8
      - run: pnpm build
      - run: node scripts/render-examples.mjs "$RUNNER_TEMP/media" --shard "${{ matrix.shard }}/6"
      - name: Attach the videos to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/media/*.mp4 --clobber
          echo "::notice::Shard ${{ matrix.shard }} attached $(ls "$RUNNER_TEMP"/media/*.mp4 | wc -l) videos to $TAG"

  undraft:
    name: Publish the release
    needs: [publish, media]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.publish.outputs.version }}
    steps:
      - run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "::notice::$TAG has $(gh release view "$TAG" --json assets --jq '.assets | length') assets"
