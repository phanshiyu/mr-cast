name: Set up mr-cast
description: Install pnpm (the version in package.json), Node, and the locked dependencies, with the pnpm store cached.
inputs:
  node-version:
    description: Node version; defaults to .nvmrc
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
